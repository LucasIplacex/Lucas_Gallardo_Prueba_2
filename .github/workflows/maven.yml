
name: Pruebas Maven

on:
  push:
    branches:
      - main
      - feature/prueba2
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas unitarias y escenarios BDD
        run: mvn --batch-mode test

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-junit
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Publicar reporte BDD HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-bdd-cucumber
          path: target/cucumber-reports/reporte.html
          if-no-files-found: warn

      - name: Alertar si fallan las pruebas
        if: failure()
        run: |
          echo "## ALERTA: Falló la validación de calidad" >> "$GITHUB_STEP_SUMMARY"
          echo "Revisar las pruebas unitarias, los escenarios BDD y los registros del pipeline." >> "$GITHUB_STEP_SUMMARY"